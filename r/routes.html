    <style>
        #routes{
    display:grid;

    border:1px solid var(--large-button);
    border-radius:12px;
    padding: 0px 20px;

    display:flex;
    gap:12px;
    margin:16px 0;

    padding: 2px 15px;
    border: solid var(--large-button) 1px ;
    border-radius: 5px;
    cursor: pointer;
}

    color: greenyellow;

<body>

<h1>Rotas do Path</h1>

<p id="routes-count"></p>

<div id="routes"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const container2 = document.getElementById("routes");
    const routesCount = document.getElementById("routes-count");

    routesCount.textContent =
    `${Object.keys(ROUTES).length} códigos cadastrados`;

    const container = document.getElementById("routes");
    const BASE_URL = `${location.origin}/pth/r/?`; //mudar o caminho caso seja teste em localhost

    async function copyText(text) {

        if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;

        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
    }

    Object.entries(ROUTES).forEach(([slug, url]) => {

        const pathUrl = BASE_URL + slug;

        const card = document.createElement("div");
        card.className = "route-card";

        card.innerHTML = `
            <h3>${slug}</h3>

            <div class="buttons">
                <button class="copy-btn">Copiar URL Route</button>
                <a href="${pathUrl}" target="_blank">Abrir Route</a>
                <a href="${url}" target="_blank">Abrir Destino</a>
            </div>

            <p><strong>Route:</strong><br>${pathUrl}</p>
            <p><strong>Destino:</strong><br>${url}</p>
        `;

        const copyBtn = card.querySelector(".copy-btn");

        copyBtn.addEventListener("click", async () => {

            try {
                await copyText(pathUrl);

                const oldText = copyBtn.textContent;
                copyBtn.textContent = "Copiado!";
                copyBtn.className = "copy-url";

                setTimeout(() => {
                    copyBtn.textContent = oldText;
                    copyBtn.classList.remove("copy-url");
                }, 1500);
                

            } catch (err) {
                console.error(err);
                alert("Não foi possível copiar a URL.");
            }

        });

        container.appendChild(card);

    });

});
</script>
